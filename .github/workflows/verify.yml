name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - run: test -s cmd/unapid/main.go
      - run: grep -Fq 'Copyright 2026 Relmio contributors' NOTICE
      - run: grep -Fq 'https://github.com/Demonbane18/relmio' UPSTREAM.md
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./cmd/unapid
